services:
  autoqa:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8765}:${PORT:-8765}"
    environment:
      DATABASE_URL: ""
      MYSQLHOST: mysql
      MYSQLPORT: "3306"
      MYSQLUSER: ${MYSQL_USER:-autoqa}
      MYSQLPASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQLDATABASE: ${MYSQL_DATABASE:-autoqa}
      PORT: ${PORT:-8765}
      AUTOQA_ENV: ${AUTOQA_ENV:-development}
      AUTOQA_MODE: ${AUTOQA_MODE:-demo}
      AUTOQA_SECRET_KEY: ${AUTOQA_SECRET_KEY:-}
      AUTOQA_ALLOW_PRIVATE_TARGETS: ${AUTOQA_ALLOW_PRIVATE_TARGETS:-false}
      AUTOQA_DATA_DIR: /app/data
      AUTOQA_ARTIFACT_DIR: /app/artifacts
      AUTOQA_PUBLIC_BASE_URL: ${AUTOQA_PUBLIC_BASE_URL:-}
      HOST: 0.0.0.0
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_DAILY_LIMIT: ${DEMO_DAILY_LIMIT:-20}
      DEMO_IP_LIMIT: ${DEMO_IP_LIMIT:-3}
      DEMO_LLM_ENABLED: ${DEMO_LLM_ENABLED:-false}
      AUTOQA_ALLOWED_ORIGINS: ${AUTOQA_ALLOWED_ORIGINS:-}
      AUTOQA_RESOURCE_ORIGINS: ${AUTOQA_RESOURCE_ORIGINS:-}
      AUTOQA_API_TOKEN: ${AUTOQA_API_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-compatible}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AUTOQA_LLM_BASE_URL: ${AUTOQA_LLM_BASE_URL:-https://api.openai.com/v1}
      AUTOQA_LLM_API_KEY: ${AUTOQA_LLM_API_KEY:-}
      AUTOQA_LLM_MODEL: ${AUTOQA_LLM_MODEL:-}
      AUTOQA_DEMO_LOGIN_FAULT: ${AUTOQA_DEMO_LOGIN_FAULT:-true}
    volumes:
      - checkpoints:/app/data
      - evidence:/app/artifacts
    shm_size: 1gb
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autoqa}
      MYSQL_USER: ${MYSQL_USER:-autoqa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  mysql-data:
  checkpoints:
  evidence:
