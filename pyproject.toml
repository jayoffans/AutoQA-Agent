[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoqa-agent"
version = "1.0.0"
description = "Checkpointed browser testing and evidence-based failure diagnosis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "pymysql>=1.1,<2",
  "cryptography>=44", "playwright>=1.51,<2", "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "httpx>=0.28,<1",
  "langfuse>=3.3,<5", "mcp>=1.9,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["autoqa*"]

[tool.setuptools.package-data]
autoqa = ["static/*", "demo/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
