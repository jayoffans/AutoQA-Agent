<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AutoQA Demo · 表单审批</title><link rel="stylesheet" href="/demo/demo.css"><main><span class="badge">HUMAN IN THE LOOP</span><h1>测试报名表</h1><p>Agent 会在提交前暂停，等待你在工作台中审批。</p><form id="demo-form"><label for="name">姓名</label><input id="name" required><label for="email">邮箱</label><input id="email" type="email" required><button id="submit-form" type="submit">提交测试表单</button><div id="result" role="status"></div></form><p class="notice">提交仅更改本页面状态，不向外部服务发送信息。</p></main><script>document.getElementById('demo-form').addEventListener('submit',e=>{e.preventDefault();const r=document.getElementById('result');r.className='result';r.textContent='表单提交成功';document.getElementById('submit-form').disabled=true;});</script></html>
