<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AutoQA Demo · 登录</title><link rel="stylesheet" href="/demo/demo.css"><main><span class="badge">AUTOQA TEST FIXTURE</span><h1>欢迎回来</h1><p>用演示账号开始你的测试流程。</p><form id="login-form"><label for="username">用户名</label><input id="username" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button id="login-button" type="submit">登录工作台 →</button><div id="message" aria-live="polite"></div></form><p class="notice">仅用于自动化测试。演示账号：demo / autoqa123</p></main><script>document.getElementById('login-form').addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('username').value==='demo'&&document.getElementById('password').value==='autoqa123'){sessionStorage.setItem('demo-auth','true');location.href='/demo/dashboard.html';}else{document.getElementById('message').textContent='用户名或密码错误';}});</script></html>
